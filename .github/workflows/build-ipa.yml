name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project SMBPhotoSync/SMBPhotoSync.xcodeproj \
            -scheme SMBPhotoSync \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/SMBPhotoSync.app Payload/
          zip -r SMBPhotoSync.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SMBPhotoSync-ipa
          path: SMBPhotoSync.ipa
